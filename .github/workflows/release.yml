name: Release

# Releases come from release-please (its release PR, merged on main) or from a version
# tag pushed by a maintainer (`v0.1.0`, the first release). A tag that release-please
# creates does not start this workflow again: GitHub runs no workflow for events made
# with the workflow's own token.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # release commit, tag and GitHub release
      issues: write          # release PR labels
      pull-requests: write   # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    needs: release-please
    if: >-
      !cancelled() && (github.ref_type == 'tag'
      || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false   # a release build restores nothing from the shared cache
      - name: The tag names the project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "tag $TAG != project version $version"; exit 1; }
      - run: uv build --no-sources
      - run: uv run --no-project python scripts/check_dist.py --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eufy-home-security
    permissions:
      id-token: write   # PyPI trusted publishing and attestation signing; no API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Uploads the verified files unchanged and signs PEP 740 attestations for them (default
      # on); `uv publish` would only upload attestations some other step had produced.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
